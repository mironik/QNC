[package]
name = "qnc-player-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qnc-broadcast-player"
path = "src/main.rs"

[dependencies]
qnc-player-contract.workspace = true
qnc-player-frame-transport.workspace = true
qnc-player-input.workspace = true
qnc-broadcast-engine.workspace = true
qnc-media-stream.workspace = true
qnc-media-decode.workspace = true
qnc-decoder-catalog.workspace = true
qnc-video-output.workspace = true
qnc-audio-output.workspace = true
qnc-json-transport.workspace = true
qnc-transport-resolver.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = "24.0.5"
winit = "0.30.13"
pollster = "0.4.0"

[dev-dependencies]
qnc-work-settings.workspace = true
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
