[package]
name = "qnc-shot-content-siglip"
version = "0.1.0"
edition = "2021"
description = "QNC shot-content plug-in: what pictures show with a SigLIP model in pure Rust (contract qnc.shot-content 2), as its own program"

[dependencies]
qnc-ai-catalog = { workspace = true }
qnc-dev-diagnostics = { workspace = true }
qnc-shot-content = { workspace = true }
qnc-siglip = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
