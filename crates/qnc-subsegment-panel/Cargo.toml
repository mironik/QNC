[package]
name = "qnc-subsegment-panel"
version = "0.1.0"
edition = "2021"
description = "QNC public passive panel: the SubSegment open in place of the source timeline (user 2026-10-29) - its parts one after another on the one qnc-timeline, the playhead of the player and the pause and join (cut or crossfade) before every part; it paints only and gives catalog actions"

[dependencies]
eframe = { workspace = true }
qnc-action-event = { workspace = true }
qnc-script = { workspace = true }
qnc-timeline = { workspace = true }
qnc-ui-text = { workspace = true }
