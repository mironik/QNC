[package]
name = "qnc-media-stream"
version = "0.1.0"
edition = "2024"
description = "Public bounded read-only byte streams for QNC media URIs"

[dependencies]
qnc-source-reader.workspace = true
qnc-transport-resolver.workspace = true
qnc-json-transport.workspace = true
serde.workspace = true
ureq = { version = "2.12", features = ["native-certs"] }
url = "2"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
qnc-player-input.workspace = true
qnc-work-settings.workspace = true
qnc-media-metadata.workspace = true
sha2 = "0.10"
