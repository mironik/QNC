[package]
name = "qnc-prerender-db"
version = "0.1.0"
edition = "2021"
description = "QNC public module: the rendered units of the story's prerender as a table module of the project database intermediary; it knows no worker, form or application"

[dependencies]
qnc-ui-text = { workspace = true }
qnc-db-broker = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
