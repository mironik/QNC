edition = "2021"
description = "QNC public module: a title card picture (white text on black, the size of the project picture) made from a text - the picture of a recorded voice-over clip (user 2026-10-28); it knows no form, script or database"

[dependencies]
ab_glyph = "0.2.32"
epaint_default_fonts = "0.31.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
