[package]
name = "qnc-wav2vec2"
version = "0.1.0"
edition = "2021"
description = "QNC public block: a wav2vec2 CTC model (safetensors) in pure Rust, the log probabilities of its letters every 20 ms of 16 kHz speech"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
serde_json = { workspace = true }

[dev-dependencies]
qnc-transcribe-jobs = { workspace = true }
