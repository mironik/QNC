[package]
name = "qnc-skeleton-panel"
version = "0.1.0"
edition = "2021"
description = "QNC public passive panel: the skeleton of the story (user 2026-10-31, Media Assist Video) - the blocks of the story one row each, every row its parts on the one qnc-timeline; a click opens the block as a SubSegment to edit, Send to Story puts the skeleton at the end of the story; it paints only and gives catalog actions"

[dependencies]
eframe = { workspace = true }
qnc-action-event = { workspace = true }
qnc-desktop-theme = { workspace = true }
qnc-script = { workspace = true }
qnc-theme-styles = { workspace = true }
qnc-timeline = { workspace = true }
qnc-ui-kit = { workspace = true }
qnc-ui-text = { workspace = true }
