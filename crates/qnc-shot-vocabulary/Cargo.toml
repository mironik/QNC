[package]
name = "qnc-shot-vocabulary"
version = "0.1.0"
edition = "2021"
description = "QNC public block: the vocabulary of what a shot may show (Places365 and newsroom things), its text vectors kept once on this computer in data/qnc-shot-vocabulary.db (its only writer), a shot's best terms from its vector"

[dependencies]
qnc-shot-content = { workspace = true }
qnc-shot-content-db = { workspace = true }
qnc-shot-labels = { workspace = true }
qnc-ui-text = { workspace = true }
rusqlite = { workspace = true }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
