[package]
name = "qnc-florence2"
version = "0.1.0"
edition = "2021"
description = "QNC public block: the Florence-2 model (ONNX, through the ONNX Runtime library beside the program): a sentence of what a picture shows"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std", "ndarray"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
