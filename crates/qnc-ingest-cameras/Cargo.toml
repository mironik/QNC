[package]
name = "qnc-ingest-cameras"
version = "0.3.0"
edition = "2021"
description = "QNC public composition: the record formats Ingest reads (built in or plug-in programs, from the catalog of formats), each with the camera profiles (text files) of its cameras; Select and the application never name a camera"

[dependencies]
qnc-camera-adapter = { workspace = true }
qnc-camera-profiles = { workspace = true }
qnc-camera-profile-adapter = { workspace = true }
qnc-sony-metadata = { workspace = true }
qnc-camera-generic-file = { workspace = true }
qnc-dev-diagnostics = { workspace = true }
qnc-plugin-process = { workspace = true }
qnc-record-format-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
