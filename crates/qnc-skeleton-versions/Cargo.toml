edition = "2021"
description = "QNC public piece: the list of S-Story versions of the project on the preview, read outside the UI thread from qnc-skeleton-db, as cards of the pool's Stories tab, and which version is open; each version is a copy of the Story of its own shown by the Story machinery; it writes nothing"

