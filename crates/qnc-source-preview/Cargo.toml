[package]
name = "qnc-source-preview"
version = "0.1.0"
edition = "2021"
description = "QNC public component: source preview session for one clip (Broadcast Player, monitor picture, timeline projection and published timeline artifacts); no form, no application, read-only"

[dependencies]
qnc-gain = { workspace = true }
qnc-player-clip-content = { workspace = true }
serde_json = { workspace = true }
qnc-dev-diagnostics = { workspace = true }
qnc-monitor-state = { workspace = true }
qnc-still-locator = { workspace = true }
qnc-worker-wake = { workspace = true }
qnc-ui-text = { workspace = true }
qnc-content-read = { workspace = true }
qnc-content-store = { workspace = true }
qnc-db-broker = { workspace = true }
qnc-filmstrip = { workspace = true }
qnc-playback-activity = { workspace = true }
qnc-player-client = { workspace = true }
qnc-player-input = { workspace = true }
qnc-program-input = { workspace = true }
qnc-player-launcher = { workspace = true }
qnc-player-timeline = { workspace = true }
qnc-source-bindings = { workspace = true }
qnc-timeline-model = { workspace = true }
qnc-timeline-assets = { workspace = true }
qnc-wave = { workspace = true }
qnc-work-settings = { workspace = true }

[dev-dependencies]
qnc-player-contract = { workspace = true }
