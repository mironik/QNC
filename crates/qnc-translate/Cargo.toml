[package]
name = "qnc-translate"
version = "0.1.0"
edition = "2021"
description = "QNC public block: a Marian translation model (OPUS-MT, safetensors) in pure Rust: a sentence into the model's target language"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
