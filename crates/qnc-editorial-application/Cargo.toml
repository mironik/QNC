[package]
name = "qnc-editorial-application"
version = "0.1.0"
edition = "2021"
description = "QNC editorial application composition root: clip list of the active project (public views, read-only) and a source preview session; no form, no scan, no probe, no writes"

[dependencies]
qnc-content-read = { workspace = true }
qnc-source-bindings = { workspace = true }
qnc-source-preview = { workspace = true }
qnc-timeline = { workspace = true }
qnc-work-settings = { workspace = true }
