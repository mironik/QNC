[package]
name = "qnc-editorial-application"
version = "0.1.0"
edition = "2021"
description = "QNC editorial application composition root: clip list of the active project (public views, read-only) and a source preview session; no form, no scan, no probe, no writes"

[dependencies]
qnc-active-project-read = { workspace = true }
qnc-clip-posters = { workspace = true }
qnc-content-store = { workspace = true }
qnc-db-broker = { workspace = true }
qnc-content-read = { workspace = true }
qnc-image-assets = { workspace = true }
qnc-media-thumbnail = { workspace = true }
qnc-program-segments = { workspace = true }
qnc-program-waveform = { workspace = true }
qnc-content-artifacts = { workspace = true }
qnc-wrap-session = { workspace = true }
qnc-panel-focus = { workspace = true }
qnc-source-timecode = { workspace = true, features = ["read"] }
qnc-pending-marks = { workspace = true }

qnc-source-bindings = { workspace = true }
qnc-source-preview = { workspace = true }
qnc-timeline-assets = { workspace = true }
qnc-source-reader = { workspace = true }
qnc-timeline = { workspace = true }
qnc-virtual-short-cards = { workspace = true }
qnc-virtual-short-stills = { workspace = true }
qnc-virtual-shots = { workspace = true }
qnc-shot-stills = { workspace = true }
qnc-work-settings = { workspace = true }
