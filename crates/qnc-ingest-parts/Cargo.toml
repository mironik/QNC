[package]
name = "qnc-ingest-parts"
version = "0.1.0"
edition = "2021"
description = "QNC public module: the parts of source clips marked in Ingest (copied alone at import), a table module of the project database intermediary"

[dependencies]
qnc-ui-text = { workspace = true }
qnc-content-read = { workspace = true }
qnc-clip-row = { workspace = true }
qnc-form-pieces = { workspace = true }
qnc-db-broker = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
