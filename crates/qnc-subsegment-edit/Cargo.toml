[package]
name = "qnc-subsegment-edit"
version = "0.1.0"
edition = "2021"
description = "QNC public piece: editing a run of source parts on one flat timeline as covers are edited (user 2026-10-29) - the edges of each part (keys, wheel, mouse, trim zoom), its A1, its place, the pause and join before it, played through the one player as a program; it writes nothing, its owner writes what it asks (a SubSegment of the script, the S-Story skeleton)"

[dependencies]
qnc-script-db = { workspace = true }
qnc-script-draft = { workspace = true }
qnc-program-input = { workspace = true }
qnc-source-preview = { workspace = true }
qnc-source-timecode = { workspace = true }
qnc-program-waveform = { workspace = true }
qnc-program-filmstrip = { workspace = true }
qnc-program-view = { workspace = true }
qnc-trim-stills = { workspace = true }
qnc-wheel-jog = { workspace = true }
qnc-timeline = { workspace = true }
qnc-ui-text = { workspace = true }
