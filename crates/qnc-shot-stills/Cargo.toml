[package]
name = "qnc-shot-stills"
version = "0.1.0"
edition = "2021"
description = "QNC public block: the stills of a saved virtual shot (IN/OUT of a short, the poster of a B-roll shot of a cover) written to the project product folder and published through the virtual shots table module"

[dependencies]
qnc-db-broker = { workspace = true }
qnc-virtual-short-stills = { workspace = true }
qnc-virtual-shots = { workspace = true }
qnc-work-settings = { workspace = true }
