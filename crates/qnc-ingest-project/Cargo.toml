[package]
name = "qnc-ingest-project"
version = "0.1.0"
edition = "2021"
description = "QNC public block: the project an Ingest surface works on, read from the active project database (work plan, clip catalog, project database targets, project folder, application order); no form, no writes"

[dependencies]
