[package]
name = "qnc-siglip"
version = "0.1.0"
edition = "2021"
description = "QNC public block: a SigLIP image and text model (safetensors) in pure Rust: what a picture shows as a vector, and how well a text describes it"

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
