[package]
name = "qnc-voice-catalog"
version = "0.1.0"
edition = "2021"
description = "QNC public module: a voice record of the script as a clip of kind voice in the project's catalog (user 2026-10-30), described by what QNC wrote (no probe), imported where it is, written through the one writer of the content database, so the Broadcast Player plays it; it knows no form or script"

[dependencies]
qnc-content-store = { workspace = true }
qnc-media-metadata = { workspace = true }
qnc-media-record-db = { workspace = true }
qnc-media-records = { workspace = true }
qnc-source-index-db = { workspace = true }
qnc-work-settings = { workspace = true }
qnc-ui-text = { workspace = true }

[dev-dependencies]
qnc-voice-clip = { workspace = true }
rusqlite = { workspace = true }
tempfile = "3"
