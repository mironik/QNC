[package]
name = "qnc-fine-wave"
version = "0.1.0"
edition = "2021"
description = "QNC public piece: the fine wave of a cut for the trim zoom, read from the camera original around the cut through the decoder catalog, kept in memory, a peak per column; no probe, no database"

[dependencies]
qnc-gain = { workspace = true }
qnc-dev-diagnostics = { workspace = true }
qnc-sound-range = { workspace = true }
qnc-program-waveform = { workspace = true }
qnc-still-locator = { workspace = true }
