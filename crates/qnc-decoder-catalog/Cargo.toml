[package]
name = "qnc-decoder-catalog"
version = "0.1.0"
edition = "2024"

[dependencies]
qnc-media-metadata = { workspace = true }
qnc-frame-timebase.workspace = true
qnc-media-decode.workspace = true
qnc-media-stream.workspace = true
qnc-ffmpeg-decode.workspace = true
qnc-libav-decode = { path = "../qnc-libav-decode", optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
# The in-process video decoder (needs FFMPEG_DIR and LIBCLANG_PATH to build).
libav = ["dep:qnc-libav-decode"]
