[package]
name = "qnc-skeleton-db"
version = "0.1.0"
edition = "2021"
description = "QNC public module: the S-Story skeleton (elements as source clips, in order) as a table module of the project database intermediary; it knows no form, worker or application"

[dependencies]
qnc-ui-text = { workspace = true }
qnc-db-broker = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
qnc-active-project-read = { workspace = true }
tempfile = "3"
