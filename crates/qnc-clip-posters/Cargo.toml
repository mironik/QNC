[package]
name = "qnc-clip-posters"
version = "0.1.0"
edition = "2021"
description = "QNC public component: loads clip posters in the background from resolved read-only source readers or a project folder; no form, no application, no location policy"

[dependencies]
qnc-image-assets = { workspace = true }
qnc-media-thumbnail = { workspace = true }
qnc-source-reader = { workspace = true }

[dev-dependencies]
tempfile = "3"
