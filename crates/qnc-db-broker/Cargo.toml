[package]
name = "qnc-db-broker"
version = "0.1.0"
edition = "2021"
description = "QNC public module: the one serial intermediary of a project database (v5 ProjectDbBroker); it knows no domain: table modules own their tables and requests"

[dependencies]
qnc-contracts = { workspace = true }
qnc-json-transport = { workspace = true }
qnc-transport-resolver = { workspace = true }
qnc-work-settings = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
