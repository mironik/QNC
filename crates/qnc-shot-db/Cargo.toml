[package]
name = "qnc-shot-db"
version = "0.1.0"
edition = "2021"
description = "QNC public module: the shots of the clips of a project (clip frames, looks, sharpest picture, or why a clip could not be analysed) as a table module of the project database intermediary; it knows no form, worker or application"

[dependencies]
qnc-ui-text = { workspace = true }
qnc-db-broker = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
