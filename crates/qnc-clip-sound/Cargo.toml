[package]
name = "qnc-clip-sound"
version = "0.1.0"
edition = "2021"
description = "QNC public module: the A1/A2 sound chosen for each clip on the source timeline (channel, on/off, level) as a table module of the project database intermediary; it knows no form, worker or application"

[dependencies]
qnc-ui-text = { workspace = true }
qnc-db-broker = { workspace = true }
qnc-dev-diagnostics = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
