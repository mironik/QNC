[package]
name = "qnc-program-view"
version = "0.1.0"
edition = "2021"
description = "QNC public piece: what a form shows of a story program (segments, markers, slots and covers on one frame axis, duration labels) and the questions asked of it. Pure: it reads nothing and writes nothing."

[dependencies]
qnc-ui-text = { workspace = true }
qnc-status-line = { workspace = true }
qnc-alert = { workspace = true }
qnc-program-commands = { workspace = true }
qnc-program-db = { workspace = true }
qnc-program-waveform = { workspace = true }
qnc-program-loudness = { workspace = true }
qnc-export-choice = { workspace = true }
qnc-program-filmstrip = { workspace = true }
qnc-image-assets = { workspace = true }
qnc-source-timecode = { workspace = true }
