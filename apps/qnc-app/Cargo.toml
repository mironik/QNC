[package]
name = "qnc-app"
version = "0.1.0"
edition = "2021"
description = "QNC shell launcher"

[[bin]]
name = "qnc-app"
path = "src/main.rs"

[dependencies]
qnc-decoder-catalog = { workspace = true }
eframe = { workspace = true }
qnc-app-registry = { workspace = true }
qnc-desktop = { workspace = true }
qnc-ingest-desktop-adapter = { workspace = true }
qnc-media-assist-audio-ai-desktop-adapter = { workspace = true }
qnc-story-desktop-adapter = { workspace = true }
qnc-media-assist-video-desktop-adapter = { workspace = true }
qnc-media-assist-audio-desktop-adapter = { workspace = true }
qnc-project-desktop-adapter = { workspace = true }
qnc-shell-desktop-api = { workspace = true }

[features]
# The in-process decoder of the catalog for the trim zoom (FFMPEG_DIR, LIBCLANG_PATH), as the player has it.
libav = ["qnc-decoder-catalog/libav"]
