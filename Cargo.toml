qnc-scanner = { path = "crates/qnc-scanner" }
qnc-transport-resolver = { path = "crates/qnc-transport-resolver" }
qnc-ui-kit = { path = "crates/qnc-ui-kit" }
qnc-paint-pace = { path = "crates/qnc-paint-pace" }
qnc-program-commands = { path = "crates/qnc-program-commands" }
qnc-program-view = { path = "crates/qnc-program-view" }
qnc-lane-choice = { path = "crates/qnc-lane-choice" }
qnc-part-sound = { path = "crates/qnc-part-sound" }
qnc-wheel-jog = { path = "crates/qnc-wheel-jog" }
qnc-source-panel = { path = "crates/qnc-source-panel" }
qnc-source-timeline = { path = "crates/qnc-source-timeline" }
qnc-settings-form = { path = "crates/qnc-settings-form" }
qnc-virtual-short-cards = { path = "crates/qnc-virtual-short-cards" }
qnc-virtual-short-stills = { path = "crates/qnc-virtual-short-stills" }
qnc-workstation-identity = { path = "crates/qnc-workstation-identity" }
qnc-work-settings = { path = "crates/qnc-work-settings" }
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"

# Real-time pixel processing must also meet the frame budget in development builds.
[profile.dev.package.qnc-pixel-convert]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3
